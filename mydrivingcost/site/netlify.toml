# MyDrivingCost.com — Netlify configuration
#
# The site is plain static files with no build step. Every page lives at
# <dir>/index.html so the canonical URL is always clean, root-absolute and
# slash-terminated: /calculators/true-cost-to-own/ — never a .html extension.

[build]
  publish = "."
  command = ""

# Serve /foo/ for a request to /foo, and never expose the .html file itself.
[build.processing]
  skip_processing = true

# ---------------------------------------------------------------- redirects --
# Rules are evaluated in order, so host canonicalisation comes first: every
# page's <link rel="canonical"> points at the apex, and www resolving on its
# own would present the entire site to crawlers a second time.

[[redirects]]
  from = "https://www.mydrivingcost.com/*"
  to = "https://mydrivingcost.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mydrivingcost.com/*"
  to = "https://mydrivingcost.com/:splat"
  status = 301
  force = true

# Anyone arriving on a legacy .html URL is permanently sent to the clean one.
# 301 so link equity and bookmarks transfer rather than splitting.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:page.html"
  to = "/:page/"
  status = 301
  force = true

[[redirects]]
  from = "/:dir/:page.html"
  to = "/:dir/:page/"
  status = 301
  force = true

[[redirects]]
  from = "/:dir/:sub/:page.html"
  to = "/:dir/:sub/:page/"
  status = 301
  force = true

# Legacy flat URLs from the first build, kept alive deliberately.
[[redirects]]
  from = "/calculators/true-cost-to-own.html"
  to = "/calculators/true-cost-to-own/"
  status = 301
  force = true

[[redirects]]
  from = "/calculators/lease-vs-buy.html"
  to = "/calculators/lease-vs-buy/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
  force = true

# Everything unmatched renders the styled 404 rather than the host default.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ------------------------------------------------------------------ headers --

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # No third-party scripts, no analytics, no fonts from a CDN. The policy can
    # therefore be strict. 'unsafe-inline' covers the pre-paint theme script,
    # which must run before first paint to avoid a flash of the wrong theme.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# HTML is revalidated on every request so corrections ship immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprint-free asset names, so a shorter immutable window than the usual year.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
